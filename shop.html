<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Haven Bookstore</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="shop.css">
</head>

<body>
  
   <header class="site-header">

    <div class="header-logo">
        <a href="index.html">
            <img src="images/logo.png" alt="Book Haven Logo" class="logo">
        </a>
    </div>

    <button class="hamburger" id="hamburger">
        ☰
    </button>

    <nav class="header-nav" id="nav-menu">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="gallery.html">Gallery</a>
        <a href="shop.html">Shop</a>
    </nav>

</header>

<main>

    <h1 class="shop-title">Shop</h1>

    <hr>
    
    <div class="checkout-card">
            <h2>Checkout</h2>
            <button class="clear-cart-button">Clear Cart</button>
            <button class="process-order-button">Process Order</button>
        </div>

    <section class="shop-grid">

        <div class="shop-card">
            <h2>The Silent Library</h2>

            <img src="images/Client3_Book1.png" alt="The Silent Library">

            <button class="cart-button">Add To Cart</button>
        </div>

        <div class="shop-card">
            <h2>Winds of Autumn</h2>

            <img src="images/Client3_Book2.png" alt="Winds of Autumn">

            <button class="cart-button">Add To Cart</button>
        </div>

        <div class="shop-card">
            <h2>Beyond the Stars</h2>

            <img src="images/Client3_Book3.png" alt="Beyond the Stars">

            <button class="cart-button">Add To Cart</button>
        </div>

        <div class="shop-card">
            <h2>Tote Bag</h2>

            <img src="images/Client3_ToteBag.png" alt="Tote">

            <button class="cart-button">Add To Cart</button>
        </div>

        <div class="shop-card">
            <h2>Ocean of Dreams</h2>

            <img src="images/Client3_Magazine1.png" alt="Ocean of Dreams">

            <button class="cart-button">Add To Cart</button>
        </div>

        <div class="shop-card">
            <h2>Lost Kingdom</h2>

            <img src="images/Client3_Magazine2.png" alt="Lost Kingdom">

            <button class="cart-button">Add To Cart</button>
        </div>

        <div class="shop-card">
            <h2>Fading Echoes</h2>

            <img src="images/Client3_Magazine3.png" alt="Fading Echoes">

            <button class="cart-button">Add To Cart</button>
        </div>

        <div class="shop-card">
            <h2>Golden Horizon</h2>

            <img src="images/Client3_Notebook.png" alt="Golden Horizon">

            <button class="cart-button">Add To Cart</button>
        </div>

        <div class="shop-card">
            <h2>Stickers</h2>

            <img src="images/Client3_Stickers.png" alt="Stickers">

            <button class="cart-button">Add To Cart</button>
        </div>

    </section>

</main>
  
  <footer class="site-footer">

    <div class="footer-logo">
        <img src="images/logo.png" alt="Book Haven Footer Logo" class="logo">
    </div>

    <div class="footer-links">

        <a href="#" onclick="toggleContactForm()">Contact Us</a>

        <a href="#">Instagram</a>

        <a href="#">Twitter</a>

        <a href="mailto:contact@bookhaven.com">Email</a>

         <a href="#" onclick="toggleSubscribeForm()">Subscribe</a>

    </div>

    <div id="contact-form" class="contact-form">

        <h3>Contact Us</h3>

        <form id="contact-us-form">

            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name"><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"><br><br>

            <label for="feedback">Feedback:</label><br>
            <textarea id="feedback" name="feedback"></textarea><br><br>

            <label for="custom-order">Custom Order Request:</label><br>
            <textarea id="custom-order" name="custom-order"></textarea><br><br>

            <input type="submit" value="Submit" required>

        </form>

    </div>
    <div id="subscribe-form" class="contact-form">

    <h3>Subscribe</h3>

    <form id="subscribe-email-form">

        <label for="subscribe-email">Email:</label><br>

        <input 
            type="email" 
            id="subscribe-email" 
            name="subscribe-email" 
            required
        ><br><br>

        <input type="submit" value="Submit">

    </form>

</div>


</footer>
    <script>
    const hamburger = document.getElementById("hamburger");
    const navMenu = document.getElementById("nav-menu");

    hamburger.addEventListener("click", () => {
        navMenu.classList.toggle("active");
    });

     const cartButtons = document.querySelectorAll(".cart-button");

    cartButtons.forEach(button => {

        button.addEventListener("click", () => {

            alert("Item added to the cart.");

        });

    });
    function toggleContactForm() {

    const form = document.getElementById("contact-form");

    if (form.style.display === "block") {
        form.style.display = "none";
    } else {
        form.style.display = "block";
    }

}

function toggleSubscribeForm() {

    const form = document.getElementById("subscribe-form");

    if (form.style.display === "block") {
        form.style.display = "none";
    } 
    
    else {
        form.style.display = "block";
    }
}

const subscribeForm = document.getElementById("subscribe-email-form");

subscribeForm.addEventListener("submit", saveSubscriberEmail);

function saveSubscriberEmail(event) {

    event.preventDefault();

    const email = document.getElementById("subscribe-email").value;

    localStorage.setItem(
        "subscriberEmail",
        email
    );

    alert("Thank you for subscribing.");

    subscribeForm.reset();
}

const cartClearButtons = document.querySelectorAll(".clear-cart-button");

cartClearButtons.forEach(button => {

    button.addEventListener("click", () => {

        alert("Cart cleared.");

    });

});

const processOrderButtons = document.querySelectorAll(".process-order-button");

processOrderButtons.forEach(button => {

    button.addEventListener("click", () => {

        alert("Thank you for your order.");

    });

});
    
contactForm.addEventListener("submit", saveFormData);

function saveFormData(event) {

    event.preventDefault();

    const customerData = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        feedback: document.getElementById("feedback").value,
        customOrder: document.getElementById("custom-order").value
    };

    localStorage.setItem(
        "customerData",
        JSON.stringify(customerData)
    );

    alert("Customer information saved.");
}
</script>

</body>
</html>
